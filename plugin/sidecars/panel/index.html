<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClearPane</title><link rel="stylesheet" href="/assets/app.css?v=20261018-images-12"><link rel="stylesheet" href="/styles.css?v=20261018-images-12"><script src="/preload.js"></script><script defer src="/assets/app.js?v=20261018-images-12"></script></head>
<body>
<header id="header">
  <div class="header-strip"><div class="brand"><span class="brand-mark" aria-hidden="true">C</span><h1>ClearPane</h1></div><div class="header-actions"><button id="show-batch" type="button" aria-haspopup="dialog" aria-controls="batch-dialog" aria-label="待发送 0 条评论"><span>待发送</span><span id="batch-count">0</span></button><button id="settings-toggle" type="button" aria-label="面板设置" aria-controls="header-content" aria-expanded="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m9 3-.7 2.2-2 .9-2.2-.5-1.5 2.6 1.5 1.7-.2 2.2-1.5 1.7 1.5 2.6 2.2-.5 2 .9.7 2.2h3l.7-2.2 2-.9 2.2.5 1.5-2.6-1.5-1.7.2-2.2 1.5-1.7-1.5-2.6-2.2.5-2-.9L12 3Z"/><circle cx="10.5" cy="11" r="3"/></svg></button></div></div>
<div id="header-content">
  <form id="open-form"><label for="path">Markdown 完整路径</label><div class="path-row"><input id="path" autocomplete="off" spellcheck="false" placeholder="粘贴本地 Markdown 文件路径"><button id="open" type="submit" disabled>打开</button></div></form>
  <section id="workspace-files" aria-label="工作区 Markdown 文章"><label for="file-search">工作区文章</label><input id="file-search" type="search" maxlength="256" placeholder="搜索文件名或路径" autocomplete="off"><div id="file-list" tabindex="0" aria-label="文章列表"></div><p id="file-list-status" class="muted" role="status">正在获取工作区…</p><button id="files-more" type="button" hidden>加载更多</button><button id="files-retry" type="button" hidden>重新加载列表</button></section>
  <div class="toolbar"><details class="file-details"><summary id="file-name">未选择文件</summary><p id="file-path"></p></details><button id="refresh" disabled>刷新</button><button id="select-comment" disabled>评论选区</button><button id="resume-comment" hidden>继续草稿</button><details id="typography"><summary aria-controls="typography-settings">设置</summary></details><div id="typography-settings" class="settings"><label for="color-mode">色彩模式</label><select id="color-mode"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select><label for="font-size">字号 <output id="font-size-value">16 px</output></label><input id="font-size" type="range" min="14" max="22" step="1" value="16"><label for="line-height">行高 <output id="line-height-value">1.8</output></label><input id="line-height" type="range" min="1.4" max="2.2" step="0.1" value="1.8"><p id="settings-status">仅保存排版和色彩模式。</p></div></div>
  <p id="status" role="status" aria-live="polite">选择 Markdown 文件。</p>
</div></header>
<main id="reader" tabindex="0" aria-label="文档预览"><p id="batch-status" class="muted" role="status" hidden></p><section id="empty"><span class="empty-symbol" aria-hidden="true">Aa</span><h2>开始阅读</h2><p id="empty-text">粘贴本地 .md 或 .markdown 完整路径，打开后开始阅读。</p><p class="muted">选中文字后加入评论，累计后统一发送到主会话。</p></section><article id="preview" hidden></article></main>
<button id="floating-comment" hidden>评论</button>
<div id="comment-markers" role="group" aria-label="正文评论修改入口"></div>
<section id="comment-panel" hidden role="dialog" aria-label="选区评论"><form id="comment-form"><div class="comment-heading"><h2>选区评论</h2><button id="cancel-comment" type="button">取消</button></div><details class="comment-reference"><summary aria-label="查看引用与文件来源"><span class="comment-reference-title"><span class="reference-arrow" aria-hidden="true">▶</span> 查看引用与文件来源</span><span id="comment-help" class="muted">加入后不会运行 Agent。按 Esc 收起并保留草稿。</span></summary><p id="quote-path"></p><blockquote id="quote"></blockquote></details><label for="comment">你的评论</label><textarea id="comment" rows="3" maxlength="4000" placeholder="描述你对这段文字的意见…"></textarea><p id="draft-warning" class="error" role="status"></p><div class="comment-actions"><span id="comment-count">0 / 4000</span><button id="add-comment" type="submit" aria-keyshortcuts="Control+Enter" disabled>加入待发送（Ctrl+Enter）</button></div></form></section>
<dialog id="batch-dialog" aria-labelledby="batch-title"><form id="batch-form"><div class="comment-heading"><h2 id="batch-title">待发送评论</h2><button id="close-batch" type="button">关闭</button></div><div id="batch-list"></div><label for="batch-instruction">统一指令（可选）</label><textarea id="batch-instruction" rows="2" maxlength="4000" placeholder="例如：执行这些更改"></textarea><p id="batch-size" class="muted"></p><p id="batch-warning" class="error" role="status"></p><div class="comment-actions batch-actions"><button id="clear-batch" type="button">清空评论</button><button id="send-batch" type="submit" aria-keyshortcuts="Control+Enter" disabled>统一发送（Ctrl+Enter）</button></div><button id="unlock-batch" type="button" hidden>已检查主会话，解锁重试</button></form></dialog>
<dialog id="link-dialog"><label for="link-url">复制链接地址</label><input id="link-url" readonly><p>按 Ctrl+C 复制地址。</p><button id="close-link">关闭</button></dialog>
</body></html>
